---
version: '3.8'

networks:
  traefik_traefik:
    external: true

secrets:
  # All created by prometheus.sh. Infisical-backed ones are versioned by a hash of the value,
  # so a rotated value becomes a new secret; just re-run ./prometheus.sh after rotating.
  gmail_app_password:            # Infisical /email/GMAIL_APP_PASSWORD
    external: true
    name: ${ALERTMANAGER_GMAIL_SECRET:?run ./prometheus.sh}
  ha_scrape_token:               # Infisical /home-assistant/PROMETHEUS_HA_SCRAPE_TOKEN
    external: true
    name: ${PROMETHEUS_HA_SCRAPE_SECRET:?run ./prometheus.sh}
  grafana_renderer_token:        # random, generated once, shared by grafana + renderer only
    external: true
    name: grafana_renderer_token

services:
  prometheus:
    #image: prom/prometheus:v2.35.0
    image: prom/prometheus:v3
    networks:
    - default
    - traefik_traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      placement:
        constraints:
        - node.role == manager
      labels:
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.sellerdale.com`)"
      - "traefik.http.routers.prometheus.entrypoints=https"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=resolver"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_traefik"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=8760h"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-admin-api"
      - "--web.external-url=https://prometheus.sellerdale.com"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    secrets:
      - ha_scrape_token
    volumes:
      - /mnt/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/docker/prometheus/rules:/etc/prometheus/rules:ro
      - /mnt/docker/prometheus/data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    networks:
    - default
    - traefik_traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      placement:
        constraints:
        - node.role == manager
      labels:
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.sellerdale.com`)"
      - "traefik.http.routers.alertmanager.entrypoints=https"
      - "traefik.http.routers.alertmanager.tls=true"
      - "traefik.http.routers.alertmanager.tls.certresolver=resolver"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_traefik"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://alertmanager.sellerdale.com"
      # must exceed the longest repeat_interval (168h for domain expiry alerts)
      - "--data.retention=200h"
    secrets:
      - gmail_app_password
    volumes:
      - /mnt/docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /mnt/docker/alertmanager/data:/alertmanager

  grafana:
    image: grafana/grafana:13.2.4
    networks:
    - default
    - traefik_traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      placement:
        constraints:
        - node.role == manager
      labels:
      - "traefik.http.routers.grafana.rule=Host(`grafana.sellerdale.com`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=resolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_traefik"
    environment:
      - GF_RENDERING_RENDERER_TOKEN__FILE=/run/secrets/grafana_renderer_token
    secrets:
      - grafana_renderer_token
    volumes:
      - /mnt/docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - /mnt/docker/grafana/data:/var/lib/grafana

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    # the renderer has no *_FILE option, so read the token from the swarm secret at start
    entrypoint: ["tini", "--", "/bin/sh", "-c", "AUTH_TOKEN=\"$$(cat /run/secrets/grafana_renderer_token)\" exec /usr/bin/grafana-image-renderer server"]
    environment:
      - TZ=Europe/London
    secrets:
      - grafana_renderer_token
    networks:
    - default
    - traefik_traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      placement:
        constraints:
        - node.role == manager
      labels:
      - "traefik.http.routers.grafana-image-renderer.rule=Host(`grafana-image-renderer.sellerdale.com`)"
      - "traefik.http.routers.grafana-image-renderer.entrypoints=https"
      - "traefik.http.routers.grafana-image-renderer.tls=true"
      - "traefik.http.routers.grafana-image-renderer.tls.certresolver=resolver"
      - "traefik.http.services.grafana-image-renderer.loadbalancer.server.port=8081"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_traefik"

