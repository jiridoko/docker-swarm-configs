version: "3.8"

networks:
  traefik_traefik:
    external: true

services:
  ebusd:
    image: john30/ebusd:latest
    command:
      - --foreground
      - --scanconfig
      - --device=ens:10.85.0.32:9999
      - --mqtthost=mqtt.sellerdale.com
      - --mqttport=1883
      - --mqttuser=mqtt
      - --mqttpass=ruOtBilvOucWait0
      - --mqttjson
      - --mqttint=/etc/ebusd/mqtt-hassio.cfg
      - --mqttvar=filter-name=status|temp|humidity|yield|count|energy|power|runtime|hours|starts|mode|curve|load|party|sensor|timer|error|flame|pressure|fan|modulation|state
      - --httpport=8889
      - --accesslevel=*
      - --pollinterval=5
    networks:
      - default
      - traefik_traefik
    ports:
      - 8888:8888
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 60s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_traefik"
        - "traefik.http.routers.ebusd.rule=Host(`ebusd.sellerdale.com`)"
        - "traefik.http.routers.ebusd.entrypoints=https"
        - "traefik.http.routers.ebusd.tls=true"
        - "traefik.http.routers.ebusd.tls.certresolver=resolver"
        - "traefik.http.services.ebusd.loadbalancer.server.port=8889"
